name: Stack Integration

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "Dockerfile"
      - "Dockerfile.base"
      - "core/**"
      - "gateway/**"
      - "infra/**"
      - "tools/issue_chat_token.py"
      - "server/**"
      - "proto/**"
      - "protocol/**"
      - "docker/**"
      - "scripts/deploy_docker.ps1"
      - "scripts/docker_entrypoint.sh"
      - "scripts/run_linux_installed_consumer.ps1"
      - "scripts/smoke_wb.sh"
      - "tests/python/**"
      - "tests/CMakeLists.txt"
      - "tools/migrations/**"
      - "tools/wb_worker/**"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "Dockerfile"
      - "Dockerfile.base"
      - "core/**"
      - "gateway/**"
      - "infra/**"
      - "tools/issue_chat_token.py"
      - "server/**"
      - "proto/**"
      - "protocol/**"
      - "docker/**"
      - "scripts/deploy_docker.ps1"
      - "scripts/docker_entrypoint.sh"
      - "scripts/run_linux_installed_consumer.ps1"
      - "scripts/smoke_wb.sh"
      - "tests/python/**"
      - "tests/CMakeLists.txt"
      - "tools/migrations/**"
      - "tools/wb_worker/**"
  merge_group:
    types:
      - checks_requested

env:
  PYTHONIOENCODING: utf-8

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-docker-stack:
    name: Stack Runtime Integration (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Info
        run: |
          docker version
          docker compose version

      - name: Build Base Image (dynaxis-base) with cache
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.base
          tags: dynaxis-base:latest
          load: true
          cache-from: type=gha,scope=dynaxis-base-${{ runner.os }}
          cache-to: type=gha,mode=max,scope=dynaxis-base-${{ runner.os }}
          provenance: false

      - name: Verify Local Base Image
        run: |
          docker image inspect dynaxis-base:latest > /dev/null

      - name: Build and Start Chat Stack
        shell: pwsh
        run: pwsh -NoProfile -File scripts/deploy_docker.ps1 -Action up -Detached -Build -NoBase
      - name: Signed Authentication and Cross-node Chat
        run: python3 tests/python/verify_signed_chat.py --manage-stack
      - name: Database and Redis Recovery
        run: python3 tests/python/verify_core_dependency_recovery.py
      - name: Protocol and Bounded Connections
        run: |
          python3 tests/python/verify_pong.py
          python3 tests/python/verify_chat.py
          python3 tests/python/verify_whisper_cross_instance.py
          python3 tests/python/verify_soak_perf_gate.py
      - name: Session Restart and Failover
        run: python3 tests/python/verify_continuity_recovery_matrix.py --no-build
      - name: Cleanup
        if: always()
        shell: pwsh
        run: pwsh -NoProfile -File scripts/deploy_docker.ps1 -Action down
