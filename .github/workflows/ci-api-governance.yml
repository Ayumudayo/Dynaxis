name: Core API Governance
on:
  pull_request:
  push:
    branches: [main, refactor]
  workflow_dispatch:
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/check_core_api_contracts.py --check-boundary --check-boundary-fixtures --check-stable-governance-fixtures
      - run: python tools/check_doxygen_coverage.py
      - run: python tools/gen_opcode_docs.py --check
