name: Reliability Checks

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

env:
  PYTHONIOENCODING: utf-8

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-hardening:
    name: Core and Chat Sanitizers (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Info
        run: |
          docker version
          docker compose version

      - name: Build Base Image (dynaxis-base) with cache
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.base
          tags: dynaxis-base:latest
          load: true
          cache-from: type=gha,scope=dynaxis-base-${{ runner.os }}
          cache-to: type=gha,mode=max,scope=dynaxis-base-${{ runner.os }}
          provenance: false

      - name: Verify Local Base Image
        run: |
          docker image inspect dynaxis-base:latest > /dev/null

      - name: ASan Core and Chat Regression Tests
        run: |
          docker run --rm -v "${GITHUB_WORKSPACE}:/app" -v dynaxis-sanitizer-conan:/root/.conan2 -w /app dynaxis-base:latest bash -lc "set -e; python scripts/build.py --profile full --config Debug --build-dir build/linux/full/asan --sanitize --step all; python scripts/build.py --profile full --config Debug --build-dir build/linux/full/asan --sanitize --step test"
