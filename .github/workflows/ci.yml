name: Baseline Checks
on:
  push:
    branches: [main, refactor]
  pull_request:
  merge_group:
    types: [checks_requested]
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
        profile: [full, core]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Platform graphics SDKs
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build pkg-config libgl1-mesa-dev xorg-dev libxkbcommon-dev libwayland-dev wayland-protocols xvfb xauth fonts-noto-cjk && sudo xargs -a conan/linux-system-packages.txt apt-get install -y
      - uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: ${{ runner.os }}-conan-${{ matrix.profile }}-${{ hashFiles('conan.lock', 'conanfile.py', 'conan/requirements.txt', 'conan/profiles/**') }}
          restore-keys: ${{ runner.os }}-conan-${{ matrix.profile }}-
      - run: python -m pip install -r conan/requirements.txt
      - name: Prepare locked dependencies
        run: python scripts/build.py --profile ${{ matrix.profile }} --config Release --step deps
      - name: Build native source
        run: python scripts/build.py --profile ${{ matrix.profile }} --config Release --step all
      - name: Test native source and installed consumers
        run: python scripts/build.py --profile ${{ matrix.profile }} --config Release --step test
      - name: ImGui software rendering smoke
        if: runner.os == 'Linux' && matrix.profile == 'full'
        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a build/linux/full/release/client_gui/client_gui --smoke-test
      - name: Contracts and tools
        run: |
          python tools/check_doxygen_coverage.py
          python tools/check_core_api_contracts.py --check-boundary --check-boundary-fixtures --check-stable-governance-fixtures
          python tools/gen_opcode_docs.py --check
          python tools/check_markdown_links.py
          python -m unittest discover -s tests/python -p "test_*.py"
