global
  # Dev-only TCP baseline. For production TLS 1.3 + mTLS, use haproxy.tls13.cfg.
  maxconn 10000

resolvers docker
  nameserver dns 127.0.0.11:53
  resolve_retries 3
  timeout resolve 1s
  timeout retry 1s
  hold valid 1s

defaults
  mode tcp
  timeout connect 3s
  timeout client  60s
  timeout server  60s

frontend fe_gateway
  bind 0.0.0.0:6000
  default_backend be_gateway

backend be_gateway
  balance roundrobin
  server gw1 gateway-1:6000 check inter 1s rise 1 fall 2 resolvers docker resolve-prefer ipv4 init-addr libc,none
  server gw2 gateway-2:6000 check inter 1s rise 1 fall 2 resolvers docker resolve-prefer ipv4 init-addr libc,none

listen stats
  bind 0.0.0.0:8404
  mode http
  stats enable
  stats uri /
  http-request use-service prometheus-exporter if { path /metrics }
