x-server: &server
  image: dynaxis-server:local
  pull_policy: never

x-server-build: &server-build
  <<: *server
  build:
    context: ../..
    dockerfile: Dockerfile
    target: server-runtime

x-gateway: &gateway
  image: dynaxis-gateway:local
  pull_policy: never

x-gateway-build: &gateway-build
  <<: *gateway
  build:
    context: ../..
    dockerfile: Dockerfile
    target: gateway-runtime

x-worker: &worker
  image: dynaxis-worker:local
  pull_policy: never

x-worker-build: &worker-build
  <<: *worker
  build:
    context: ../..
    dockerfile: Dockerfile
    target: worker-runtime

x-migrator: &migrator
  image: dynaxis-migrator:local
  pull_policy: never

x-migrator-build: &migrator-build
  <<: *migrator
  build:
    context: ../..
    dockerfile: Dockerfile
    target: migrator-runtime

x-admin: &admin
  image: dynaxis-admin:local
  pull_policy: never

x-admin-build: &admin-build
  <<: *admin
  build:
    context: ../..
    dockerfile: Dockerfile
    target: admin-runtime

services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dynaxis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-dynaxis_db}
    ports:
      - "${POSTGRES_HOST_PORT:-35432}:5432"
    volumes:
      - dynaxis_stack_postgres_data:/var/lib/postgresql/data
    networks:
      - dynaxis-stack
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dynaxis} -d ${POSTGRES_DB:-dynaxis_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-36379}:6379"
    volumes:
      - dynaxis_stack_redis_data:/data
    networks:
      - dynaxis-stack
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrator:
    <<: *migrator-build
    command: ["migrate"]
    environment:
      DB_URI: postgresql://${POSTGRES_USER:-dynaxis}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-dynaxis_db}
      MIGRATIONS_DIR: /app/migrations
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dynaxis-stack

  wb_worker:
    <<: *worker-build
    command: ["worker"]
    environment:
      DB_URI: postgresql://${POSTGRES_USER:-dynaxis}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-dynaxis_db}
      REDIS_URI: tcp://redis:6379
      REDIS_STREAM_KEY: "session_events"
      WB_GROUP: "wb_group"
      WB_CONSUMER: "worker-1"
      METRICS_PORT: "9090"
      RUNTIME_TRACING_ENABLED: "${RUNTIME_TRACING_ENABLED:-0}"
      RUNTIME_TRACING_SAMPLE_PERCENT: "${RUNTIME_TRACING_SAMPLE_PERCENT:-100}"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    networks:
      - dynaxis-stack
    ports:
      - "${WB_WORKER_METRICS_HOST_PORT:-39093}:9090"

  gateway-1:
    <<: *gateway-build
    command: ["gateway"]
    environment:
      CHAT_AUTH_MODE: "${CHAT_AUTH_MODE:-development}"
      CHAT_AUTH_SIGNING_SECRET: "${CHAT_AUTH_SIGNING_SECRET:-}"
      GATEWAY_LISTEN: "0.0.0.0:6000"
      GATEWAY_ID: "gw1"
      REDIS_URI: "tcp://redis:6379"
      REDIS_CHANNEL_PREFIX: "dynaxis:"
      SESSION_CONTINUITY_LEASE_TTL_SEC: "${SESSION_CONTINUITY_LEASE_TTL_SEC:-900}"
      SERVER_REGISTRY_PREFIX: "gateway/instances/"
      SERVER_REGISTRY_TTL: "30"
      ALLOW_ANONYMOUS: "1"
      METRICS_PORT: "6001"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - dynaxis-stack
    ports:
      - "${GATEWAY1_TCP_HOST_PORT:-36100}:6000"
      - "${GATEWAY1_METRICS_HOST_PORT:-36001}:6001"

  gateway-2:
    <<: *gateway
    command: ["gateway"]
    environment:
      CHAT_AUTH_MODE: "${CHAT_AUTH_MODE:-development}"
      CHAT_AUTH_SIGNING_SECRET: "${CHAT_AUTH_SIGNING_SECRET:-}"
      GATEWAY_LISTEN: "0.0.0.0:6000"
      GATEWAY_ID: "gw2"
      REDIS_URI: "tcp://redis:6379"
      REDIS_CHANNEL_PREFIX: "dynaxis:"
      SESSION_CONTINUITY_LEASE_TTL_SEC: "${SESSION_CONTINUITY_LEASE_TTL_SEC:-900}"
      SERVER_REGISTRY_PREFIX: "gateway/instances/"
      SERVER_REGISTRY_TTL: "30"
      ALLOW_ANONYMOUS: "1"
      METRICS_PORT: "6001"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - dynaxis-stack
    ports:
      - "${GATEWAY2_TCP_HOST_PORT:-36101}:6000"
      - "${GATEWAY2_METRICS_HOST_PORT:-36002}:6001"

  haproxy:
    image: haproxy:2.9-alpine
    depends_on:
      - gateway-1
      - gateway-2
    ports:
      - "${HAPROXY_HOST_PORT:-6000}:6000"
      - "${HAPROXY_STATS_HOST_PORT:-8404}:8404"
    volumes:
      - ./haproxy/${HAPROXY_CONFIG:-haproxy.cfg}:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      - dynaxis-stack

  admin:
    <<: *admin-build
    command: ["admin"]
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      gateway-1:
        condition: service_started
      gateway-2:
        condition: service_started
    environment:
      ADMIN_LISTEN_PORT: "${ADMIN_LISTEN_PORT:-9200}"
      ADMIN_ENV_LABEL: "${ADMIN_ENV_LABEL:-LOCAL}"
      ADMIN_READ_ONLY: "${ADMIN_READ_ONLY:-1}"
      ADMIN_AUTH_MODE: "${ADMIN_AUTH_MODE:-development}"
      ADMIN_DEV_ROLE: "${ADMIN_DEV_ROLE:-viewer}"
      ADMIN_VIEWER_TOKEN: "${ADMIN_VIEWER_TOKEN:-}"
      ADMIN_OPERATOR_TOKEN: "${ADMIN_OPERATOR_TOKEN:-}"
      ADMIN_TOKEN: "${ADMIN_TOKEN:-}"
      ADMIN_WEB_ROOT: "/app/web"
      ADMIN_TOPOLOGY_PATH: "/app/topology.active.json"
      MIGRATIONS_DIR: "/app/migrations"
      ADMIN_TARGET_MODE: "docker"
      ADMIN_POLL_INTERVAL_MS: "${ADMIN_POLL_INTERVAL_MS:-5000}"
      ADMIN_PROBE_TIMEOUT_MS: "${ADMIN_PROBE_TIMEOUT_MS:-1500}"
      ADMIN_STALE_TTL_MS: "${ADMIN_STALE_TTL_MS:-15000}"
      ADMIN_OBSERVABILITY_ENABLED: "${ADMIN_OBSERVABILITY_ENABLED:-0}"
      ADMIN_GRAFANA_URL: "${ADMIN_GRAFANA_URL:-http://127.0.0.1:33000}"
      ADMIN_PROMETHEUS_URL: "${ADMIN_PROMETHEUS_URL:-http://127.0.0.1:39090}"
      ADMIN_HAPROXY_URL: "${ADMIN_HAPROXY_URL:-http://127.0.0.1:8404/}"
      REDIS_URI: "${REDIS_URI:-tcp://redis:6379}"
      REDIS_CHANNEL_PREFIX: "${REDIS_CHANNEL_PREFIX:-dynaxis:}"
      REDIS_STREAM_KEY: "${REDIS_STREAM_KEY:-session_events}"
      DB_URI: "postgresql://${POSTGRES_USER:-dynaxis}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-dynaxis_db}"
      WB_DLQ_STREAM: "${WB_DLQ_STREAM:-session_events_dlq}"
      WB_DEAD_STREAM: "${WB_DEAD_STREAM:-session_events_dead}"
      WB_GROUP_DLQ: "${WB_GROUP_DLQ:-wb_dlq_group}"
      WB_RETRY_MAX: "${WB_RETRY_MAX:-5}"
    ports:
      - "${ADMIN_HOST_PORT:-39200}:9200"
    volumes:
      - ./topologies:/app/topologies:ro
      - ./topology.active.json:/app/topology.active.json:ro
    networks:
      - dynaxis-stack

  prometheus:
    image: prom/prometheus:latest
    profiles: ["observability"]
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "${PROMETHEUS_HOST_PORT:-39090}:9090"
    networks:
      - dynaxis-stack

  grafana:
    image: grafana/grafana:latest
    profiles: ["observability"]
    ports:
      - "${GRAFANA_HOST_PORT:-33000}:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - dynaxis-stack

  redis_exporter:
    image: oliver006/redis_exporter:latest
    profiles: ["observability"]
    command:
      - "--redis.addr=redis://redis:6379"
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "${REDIS_EXPORTER_HOST_PORT:-39121}:9121"
    networks:
      - dynaxis-stack

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:latest
    profiles: ["observability"]
    environment:
      - DATA_SOURCE_NAME=postgresql://${POSTGRES_USER:-dynaxis}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-dynaxis_db}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${POSTGRES_EXPORTER_HOST_PORT:-39187}:9187"
    networks:
      - dynaxis-stack

volumes:
  dynaxis_stack_postgres_data:
  dynaxis_stack_redis_data:

networks:
  dynaxis-stack:
    driver: bridge
